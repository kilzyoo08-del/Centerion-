workflows:
  android-debug:
    name: Centerion - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Install Gradle and build Centerion APK
        script: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          GRADLE_VERSION="8.9"
          TOOLS_DIR="${CM_BUILD_DIR:-$PWD}/.codemagic-tools"
          GRADLE_HOME="$TOOLS_DIR/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            mkdir -p "$TOOLS_DIR"
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              --output "$TOOLS_DIR/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q -o "$TOOLS_DIR/gradle-$GRADLE_VERSION-bin.zip" -d "$TOOLS_DIR"
          fi

          echo "=== Gradle ==="
          "$GRADLE_HOME/bin/gradle" --version

          echo "=== Android SDK ==="
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME"
          else
            echo "Android SDK environment variable is not set."
            exit 1
          fi

          echo "=== Build debug APK ==="
          "$GRADLE_HOME/bin/gradle" --no-daemon --stacktrace --warning-mode all :app:assembleDebug

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "APK was not created at $APK_PATH"
            exit 1
          fi
          echo "APK successfully created: $APK_PATH"
    artifacts:
      - app/build/outputs/apk/debug/*.apk
